<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DriverHub 4.0</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="style.css?v=39">
</head>
<body>

    <div id="splash-screen"><img src="logo.png" class="splash-logo"></div>
    
    <div id="background-map"></div>

    <div id="home-screen" class="screen active">
        <div class="blur-zone-top">
            <div class="weather-pill interactive-element">
                <i class="fa-solid fa-location-arrow loc-icon"></i>
                <span id="loc-text">Suche...</span>
                <span class="divider">|</span>
                <i id="weather-icon" class="fa-solid fa-cloud"></i>
                <span id="weather-temp">--°</span>
            </div>
            <div class="logo-container"><img src="logo.png" alt="DriverHub" class="dh-logo"></div>
        </div>
        <div class="spacer-flex"></div>
        <div class="blur-zone-bottom">
            <button id="btn-start" class="btn-super-glass interactive-element">
                <i class="fa-solid fa-road"></i> START DRIVE
            </button>
        </div>
    </div>

    <div id="explore-screen" class="screen hidden">
        <div class="explore-top-ui interactive-element">
            <div class="search-bar-glass">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Where to go?">
            </div>
            <div class="filter-row">
                <button class="filter-chip" id="filter-gas"><i class="fa-solid fa-gas-pump"></i> Gas</button>
                <button class="filter-chip" id="filter-cam"><i class="fa-solid fa-camera"></i> Cams</button>
                <button class="filter-chip" id="filter-parking"><i class="fa-solid fa-square-parking"></i> Park</button>
            </div>
        </div>

        <div id="map-loading" class="loading-indicator">
            <i class="fa-solid fa-spinner fa-spin"></i> Searching...
        </div>
        
        <button id="btn-explore-recenter" class="icon-btn-floating interactive-element" style="top: auto; bottom: 120px;">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>

        <div id="gas-totem-overlay" class="hidden interactive-element">
            <div class="gas-totem-card">
                <div class="totem-header" id="totem-brand-header">
                    <h2 id="totem-brand">BRAND</h2>
                    <button class="totem-close" onclick="ExploreLogic.closeTotem()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="totem-body">
                    <div class="price-row" id="row-diesel" onclick="ExploreLogic.selectFuel('diesel')">
                        <span class="fuel-type">DIESEL</span>
                        <div class="led-price-box">
                            <span id="price-diesel">0.00</span><small>9</small>
                        </div>
                    </div>
                    <div class="price-row selected" id="row-e10" onclick="ExploreLogic.selectFuel('e10')">
                        <span class="fuel-type">SUPER E10</span>
                        <div class="led-price-box">
                            <span id="price-e10">0.00</span><small>9</small>
                        </div>
                    </div>
                    <div class="price-row" id="row-e5" onclick="ExploreLogic.selectFuel('e5')">
                        <span class="fuel-type">SUPER E5</span>
                        <div class="led-price-box">
                            <span id="price-e5">0.00</span><small>9</small>
                        </div>
                    </div>
                </div>
                <div class="totem-footer">
                    <span id="totem-status"><i class="fa-solid fa-circle-check"></i> OPEN 24/7</span>
                    <button class="btn-navigate">GO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="drive-screen" class="screen hidden">
        <div id="speed-limit" class="hidden"><span>--</span></div>
        <div class="drive-hud-top interactive-element">
            <div class="hud-row">
                <div class="hud-item"><span class="hud-label">TIME</span><span class="hud-value" id="hud-time">00:00</span></div>
                <div class="hud-item main"><span class="hud-unit">km/h</span><span class="hud-value big" id="hud-speed">0</span></div>
                <div class="hud-item"><span class="hud-label">DIST</span><span class="hud-value" id="hud-dist">0.00</span></div>
            </div>
        </div>
        <button id="btn-recenter" class="icon-btn-floating hidden interactive-element"><i class="fa-solid fa-crosshairs"></i></button>
        <div class="spacer-flex"></div>
        <div class="blur-zone-bottom">
            <button id="btn-stop" class="btn-stop-glass interactive-element"><i class="fa-solid fa-stop"></i> END DRIVE</button>
        </div>
    </div>

    <div id="summary-screen" class="screen hidden">
        <div class="solid-bg">
            <h2 style="margin-top: 50px; margin-bottom: 20px;">Drive Summary</h2>
            <div id="summary-map" class="interactive-element"></div>
            <div class="summary-card interactive-element">
                <div class="sum-row">
                    <div class="sum-item"><label>AVG SPEED</label><h3 id="sum-avg">0</h3><small>km/h</small></div>
                    <div class="sum-item"><label>DISTANCE</label><h3 id="sum-dist">0.0</h3><small>km</small></div>
                </div>
                <div class="sum-divider"></div>
                <div class="sum-row">
                    <div class="sum-item"><label>DURATION</label><h3 id="sum-time">00:00</h3></div>
                </div>
            </div>
            <div class="summary-actions">
                <button id="btn-save" class="btn-super-glass small interactive-element">SAVE TO GARAGE</button>
                <button id="btn-discard" class="btn-danger-glass interactive-element">DISCARD</button>
            </div>
        </div>
    </div>

    <div id="garage-screen" class="screen hidden">
        <div id="garage-bg"></div>
        <div class="garage-header"><h2>Garage</h2></div>
        <div class="garage-total-card">
            <div class="g-stat"><span id="total-drives">0</span><label>DRIVES</label></div>
            <div class="g-stat"><span id="total-km">0.0</span><label>KM TOTAL</label></div>
        </div>
        <div id="garage-list" class="garage-list interactive-element"></div>
        <div id="detail-overlay" class="hidden interactive-element">
            <div class="detail-header">
                <h3 id="det-date">Date</h3>
                <button class="close-detail-btn" onclick="GarageLogic.closeDetails()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="detail-content">
                <div id="detail-map-container"><div id="detail-map"></div></div>
                <div class="detail-stats-row">
                    <div class="d-stat-box"><span class="label">DIST</span><span class="val" id="det-dist">0 km</span></div>
                    <div class="d-stat-box"><span class="label">AVG</span><span class="val" id="det-avg">0</span></div>
                    <div class="d-stat-box"><span class="label">MAX</span><span class="val" id="det-max">0</span></div>
                </div>
                <div style="text-align: center; margin: 10px 0; font-size: 0.9rem; color: #888;">
                    Duration: <span id="det-time" style="color:white; font-weight:700;">00:00</span>
                </div>
                <div class="chart-container"><canvas id="speedChart"></canvas></div>
                <div style="height: 50px;"></div>
            </div>
        </div>
    </div>

    <div id="global-nav" class="bottom-nav interactive-element">
        <div class="nav-item active-home" id="nav-home"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" id="nav-explore"><i class="fa-solid fa-map"></i><span>Map</span></div>
        <div class="nav-item" id="nav-garage"><i class="fa-solid fa-warehouse"></i><span>Garage</span></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="explore.js"></script>
    <script src="garage.js"></script>
    <script src="drive.js"></script>
    <script src="app.js"></script>
</body>
</html>
